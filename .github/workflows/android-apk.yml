name: Build Android APK

# Produces an installable (debug-signed) .apk by wrapping the built web app
# with Capacitor. Download it from the run's "Artifacts" section.
# Run it from the Actions tab ("Run workflow") or it runs automatically on push.

on:
  workflow_dispatch:
  push:
    branches: ["claude/uber-like-app-build-y6xd6a"]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Capacitor
        run: npm install -D @capacitor/cli@^6 @capacitor/core@^6 @capacitor/android@^6

      - name: Generate native Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x ./android/gradlew
          ./android/gradlew -p android assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uber-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
